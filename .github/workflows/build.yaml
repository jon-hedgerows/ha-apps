name: "Build and upload containers"

on:
  # Trigger a build when a version tag is pushed
  push:
    tags:
      - "v**"

jobs:
  list-apps:
    name: List Apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.applist }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List Apps
        id: list
        run: |
          echo "applist=$(find . -type d -depth 1 -not -path '*/.*' | sed 's#./##' | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: list-apps
    strategy:
      matrix:
        app: ${{ fromJSON(needs.list-apps.outputs.apps) }}

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            # output 1.2.3
            type=semver,pattern={{version}}
            # output 1.2
            type=semver,pattern={{major}}.{{minor}}
            # output 1, disabled if zero
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.app }}
          file: Dockerfile
          build-args: |
            VERSION={{version}}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

      # attestation only works for public repositories
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
